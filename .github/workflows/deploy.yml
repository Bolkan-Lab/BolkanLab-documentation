name: Deploy documentation site

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what GitHub Pages needs.
permissions:
  contents: read

# Never let two deployments race. Queue instead of cancelling so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure GitHub Pages
        # Only needed for the real deploy; on pull requests we just want the
        # build to prove it compiles.
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build VuePress
        run: yarn build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vuepress/dist

  deploy:
    name: Deploy
    # Pull requests build but never publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
